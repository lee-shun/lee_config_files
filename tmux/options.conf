# =====================================================
#  ===  基础选项  ===
# =====================================================

# 终端与颜色
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# 扩展键协议（识别 Shift/Ctrl+Enter 等修饰回车键，tmux 3.2+，server 选项）
set -s extended-keys on

# 鼠标支持
set -g mouse on

# 滚动历史
set -g history-limit 10000

# 焦点事件（配合 vim 等）
set -s focus-events on

# 窗口/面板编号从 1 开始
set -g base-index 1
setw -g pane-base-index 1

# 窗口自动重命名与编号收缩
setw -g automatic-rename on
set -g renumber-windows on

# 终端窗口标题
set -g set-titles on
set -g set-titles-string '#h ❐ #S ● #I #W'

# 减少 prefix 按键等待时间
set -s escape-time 0

# 面板活动检测
setw -g monitor-activity on
set -g visual-activity on

# 可重复按键（如连续 resize）的判定间隔
set -g repeat-time 400

# ---- 本机 X display ----
# tmux 服务端若在 ssh -X 会话里启动过，全局环境会固化一个失效的转发值（localhost:N），
# 它继续被继承给新 pane → pane 里所有走 X 的剪贴板工具（xclip）静默失败：
# nvim 报 "clipboard: error invoking xclip"，copy-mode 的 copy-pipe 'xclip -se c -i'
# 也复制不出东西。脚本优先取本机已登录图形会话的 :N，只在有本机 X 时设置。
run-shell "$HOME/.config/lee_config_files/tmux/scripts/set-local-display.sh"

# 状态栏刷新间隔（1 秒：配合网速/CPU/内存实时显示）
set -g status-interval 1
