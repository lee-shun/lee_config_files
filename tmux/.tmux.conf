# =====================================================
#  Tmux 主配置入口
#
#  配置按职责拆分为以下子模块，均位于本目录：
#    options.conf       基础选项
#    statusline.conf    状态栏 / 主题
#    plugins.conf       TPM 插件管理
#    keybindings.conf   键位绑定
#
#  插件本体由 tpm 管理，存放在 plugins/（已 .gitignore 忽略）
# =====================================================

# 配置根目录：tmux 启动时若环境变量 TMUX_CONF_PATH 未设置则补上。
# 正常情况下 oh-my-bash 已导出该变量，此处仅作兜底。
if-shell "test -z \"${TMUX_CONF_PATH}\"" "set-environment -g TMUX_CONF_PATH \"${HOME}/.config/lee_config_files/tmux\""

# 重载配置
bind r source-file "$HOME/.config/lee_config_files/tmux/.tmux.conf" \; display "Configuration Reloaded"

# 加载子模块（keybindings 放最后，保证显式键位覆盖插件默认绑定）
# 注意：路径使用 $HOME 而非 ${HOME}，TPM 的插件解析依赖于此
source "$HOME/.config/lee_config_files/tmux/options.conf"
source "$HOME/.config/lee_config_files/tmux/statusline.conf"
source "$HOME/.config/lee_config_files/tmux/plugins.conf"
source "$HOME/.config/lee_config_files/tmux/keybindings.conf"
