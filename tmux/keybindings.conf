# =====================================================
#  ===  键位绑定  ===
#
#  本文件最后加载，保证显式键位覆盖插件默认绑定。
#  （tmux-yank 等插件在 plugins.conf 中先行加载）
# =====================================================

# 终端键盘事件（Home/End 等）
setw -g xterm-keys on

# 复制模式使用 vi 键位
setw -g mode-keys vi

# 复制内容同步写入 tmux 缓冲区
set-option -s set-clipboard on

# 粘贴系统剪贴板内容到当前面板（prefix + ] 仍为粘贴 tmux 缓冲区）
bind P run-shell 'xclip -o -selection clipboard | tmux load-buffer - && tmux paste-buffer -p'

# ---- 复制模式 ----
# v 开始选择，Enter 复制到系统剪贴板
# y/Y/D 及鼠标复制由 tmux-yank 插件提供（鼠标框选即复制到剪贴板）
bind-key -T copy-mode-vi v send-keys -X begin-selection
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'xclip -se c -i'

# ---- 面板切换（vim 风格）----
# 注意：prefix l 原本为 last-window，此处改为 select-pane -R
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---- 面板缩放（可重复按键）----
bind -r H resize-pane -L 20
bind -r J resize-pane -D 20
bind -r K resize-pane -U 20
bind -r L resize-pane -R 20
