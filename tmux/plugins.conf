# =====================================================
#  ===  TPM 插件管理  ===
# =====================================================
#  prefix + I      安装插件
#  prefix + U      更新插件
#  prefix + M-u    清理未使用的插件
#
#  插件本体安装到 plugins/（已被 .gitignore 忽略），
#  首次启动会自动克隆 TPM 并安装全部插件。
# =====================================================

# 插件安装目录（tpm 通过该环境变量定位）
set-environment -g TMUX_PLUGIN_MANAGER_PATH "${TMUX_CONF_PATH}/plugins"

# ---- 插件列表 ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-fzf'
set -g @plugin 'alexwforsythe/tmux-which-key'

# ---- tmux-yank（复制到系统剪贴板）----
# 键盘复制（y）默认即写入 CLIPBOARD；鼠标框选也改为写入 CLIPBOARD，
# 这样在其它应用里可直接 Ctrl+V 粘贴（否则默认走 PRIMARY 中键粘贴）
set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'

# ---- tmux-resurrect / tmux-continuum（会话保存与恢复）----
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# ---- tmux-plugin-sysstat（状态栏显示 CPU/内存）----
set -g @sysstat_cpu_view_tmpl '#[fg=magenta]C:#[default] #[fg=#{cpu.color}]#{cpu.pused}#[default]'
set -g @sysstat_mem_view_tmpl '#[fg=magenta]M:#[default] #[fg=#{mem.color}]#{mem.pused}#[default]'

# ---- tmux-prefix-highlight（状态栏高亮 prefix 状态）----
set -g @prefix_highlight_fg 'colour00'
set -g @prefix_highlight_bg 'red'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=colour00,bg=colour05,bold'
set -g @prefix_highlight_prefix_prompt 'PREFIX'
set -g @prefix_highlight_copy_prompt 'COPY'

# =====================================================
#  ===  本地直管插件（不随 TPM 更新）  ===
# =====================================================
# 以下插件从 TPM 列表中移除，直接跟踪在仓库中（tmux/plugins/ 下）。
# 更新方式：手动修改插件脚本并提交；不再通过 prefix + U 更新。
# 加载顺序与原 TPM 顺序一致。合并为单个 run-shell 串行执行，
# 避免多个异步 run-shell 并发改写 status-left/right 产生竞态。
run-shell "${TMUX_CONF_PATH}/plugins/tmux-plugin-sysstat/sysstat.tmux && ${TMUX_CONF_PATH}/plugins/tmux-plugin-simple-gpu/gpu.tmux && ${TMUX_CONF_PATH}/plugins/tmux-network-bandwidth/tmux-network-bandwidth.tmux && ${TMUX_CONF_PATH}/plugins/tmux-battery/battery.tmux"

# =====================================================
#  ===  TPM 引导  ===
# =====================================================

# 首次启动：克隆 TPM
if-shell "test ! -d ${TMUX_CONF_PATH}/plugins/tpm" "run-shell 'git clone https://github.com/tmux-plugins/tpm ${TMUX_CONF_PATH}/plugins/tpm'"
# 首次启动：若 TPM 已就绪但插件尚未安装，则自动安装
if-shell "test -d ${TMUX_CONF_PATH}/plugins/tpm && ! -d ${TMUX_CONF_PATH}/plugins/tmux-resurrect" "run-shell '${TMUX_CONF_PATH}/plugins/tpm/bin/install_plugins'"

# 加载 TPM（必须在所有 @plugin 之后）
run "${TMUX_CONF_PATH}/plugins/tpm/tpm"
